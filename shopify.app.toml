# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "04b77142ce8ad421f49735b05c7d0a86"
application_url = "https://upbeat-reflection-production.up.railway.app"
embedded = true
name = "order-merge-app"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,write_order_edits,write_orders,write_products"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # customers/data_request, customers/redact, and shop/redact are mandatory
  # privacy webhooks. Shopify does not allow them as regular subscriptions here.
  # Configure their endpoint URLs manually in the Partner Dashboard:
  # Apps → order-merge-app → Configuration → GDPR webhooks

[auth]
redirect_urls = [ "https://upbeat-reflection-production.up.railway.app/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
