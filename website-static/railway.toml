[build]
builder = "DOCKERFILE"
dockerfilePath = "website-static/Dockerfile"
watchPatterns = [
  "website-static/**",
  "app/routes/_index/styles.module.css",
  "public/brand/**"
]

[deploy]
healthcheckPath = "/privacy"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
