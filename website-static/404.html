        <script>
      /* Google Analytics 4 (G-VL98KWP5R4), consent-gated.
         - window.gtag always exists so site.js can call it harmlessly; hits
           only fire after window.__msAnalyticsActive is set by load().
         - On mergeship.app the consent card appears only once the intro has
           finished (or been skipped) and the visitor has scrolled ~100px;
           on pages without the intro, scrolling alone triggers it. It is
           never shown on a timer or before consent, and declined/granted
           choices persist. The footer "Cookie preferences" link reopens it
           at any time. Withdrawing consent stops the tag, clears _ga
           cookies, and reloads into the denied state.
         - On non-production hosts only, ?ga_debug loads the tag with
           debug_mode for GA4 DebugView / the Developer Traffic data filter.
           On mergeship.app it does nothing and consent is always required. */
      window.dataLayer = window.dataLayer || [];
      window.gtag =
        window.gtag ||
        function () {
          window.dataLayer.push(arguments);
        };
      (function () {
        var KEY = "ms-analytics-consent";
        var id = "G-VL98KWP5R4";
        var prod = /(^|\.)mergeship\.app$/.test(location.hostname);
        var debug =
          !prod && new URLSearchParams(location.search).has("ga_debug");
        var loaded = false;
        var banner = null;

        function load() {
          if (loaded) return;
          loaded = true;
          window.__msAnalyticsActive = true;
          var tag = document.createElement("script");
          tag.async = true;
          tag.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
          document.head.appendChild(tag);
          window.gtag("js", new Date());
          window.gtag("config", id, debug ? { debug_mode: true } : {});
        }

        function read() {
          try {
            return localStorage.getItem(KEY);
          } catch (e) {
            return null;
          }
        }

        function clearGaCookies() {
          document.cookie.split(";").forEach(function (c) {
            var n = c.split("=")[0].trim();
            if (n.indexOf("_ga") !== 0) return;
            ["", location.hostname, "." + location.hostname, ".mergeship.app"].forEach(
              function (d) {
                document.cookie =
                  n +
                  "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/" +
                  (d ? ";domain=" + d : "");
              },
            );
          });
        }

        function choose(value) {
          try {
            localStorage.setItem(KEY, value);
          } catch (e) {}
          if (banner) {
            banner.remove();
            banner = null;
          }
          if (value === "granted") {
            load();
            return;
          }
          /* Declining after consent: tell the loaded tag to stop (otherwise it
             rewrites the session cookie during unload), clear _ga cookies,
             then reload into the denied state where nothing loads. */
          if (loaded) {
            window.gtag("consent", "update", { analytics_storage: "denied" });
            clearGaCookies();
            setTimeout(function () {
              location.reload();
            }, 250);
          }
        }

        function show() {
          if (banner || !document.body) return;
          banner = document.createElement("div");
          banner.setAttribute("role", "region");
          banner.setAttribute("aria-label", "Analytics preferences");
          banner.innerHTML =
            "<style>" +
            ".ms-consent{position:fixed;z-index:9999;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 32px));padding:16px 16px 14px;border:1px solid #dfe5ef;border-radius:14px;background:#fff;box-shadow:0 8px 24px rgb(11 23 54 / 10%);color:#0b1736;font:14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;animation:ms-consent-in .22s ease-out}" +
            "@keyframes ms-consent-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}" +
            "@media (prefers-reduced-motion:reduce){.ms-consent{animation:none}}" +
            "@media (max-width:540px){.ms-consent{right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100vw - 24px)}}" +
            ".ms-consent strong{display:block;margin:0 0 4px;font-size:13px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}" +
            ".ms-consent p{margin:0 0 12px;font-size:13px;line-height:1.5}" +
            ".ms-consent a{color:#3474c8;font-size:12px;text-decoration:none}.ms-consent a:hover{text-decoration:underline}" +
            ".ms-consent .ms-actions{display:flex;gap:8px;margin-bottom:10px}" +
            ".ms-consent button{flex:1;min-height:40px;border-radius:10px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}" +
            ".ms-consent .ms-yes{border:1px solid #3474c8;background:#3474c8;color:#fff}" +
            ".ms-consent .ms-yes:hover{background:#2b66b5}" +
            ".ms-consent .ms-no{border:1px solid #c3ccdb;background:#fff;color:#0b1736}" +
            ".ms-consent .ms-no:hover{background:#f4f6fb}" +
            ".ms-consent button:focus-visible{outline:3px solid rgb(8 107 255 / 35%);outline-offset:2px}" +
            "</style>" +
            '<div class="ms-consent"><strong>Website analytics</strong>' +
            "<p>May we use analytics cookies to understand how visitors use MergeShip?</p>" +
            '<div class="ms-actions">' +
            '<button type="button" class="ms-no">Decline</button>' +
            '<button type="button" class="ms-yes">Accept</button>' +
            "</div>" +
            '<a href="/privacy">Privacy policy</a>' +
            "</div>";
          banner
            .querySelector(".ms-yes")
            .addEventListener("click", function () {
              choose("granted");
            });
          banner
            .querySelector(".ms-no")
            .addEventListener("click", function () {
              choose("denied");
            });
          document.body.appendChild(banner);
        }

        /* The card waits for the intro to finish (skipped counts as finished)
           and for the visitor to scroll ~100px. Pages without .intro treat the
           intro as already done. */
        function introDone() {
          var de = document.documentElement;
          return (
            !document.querySelector(".intro") ||
            de.classList.contains("intro-done") ||
            !de.classList.contains("intro-pending")
          );
        }

        function maybeShow() {
          if (read() !== null) {
            detach();
            return;
          }
          if (!introDone()) return;
          if ((window.scrollY || 0) < 100) return;
          show();
          detach();
        }

        var introObserver = null;
        function detach() {
          window.removeEventListener("scroll", maybeShow);
          if (introObserver) {
            introObserver.disconnect();
            introObserver = null;
          }
        }

        /* Reopen preferences from the footer "Cookie preferences" link —
           immediate, bypassing the scroll/intro gate. */
        window.__msConsentPreferences = function (ev) {
          if (ev) ev.preventDefault();
          detach();
          show();
        };

        if (!prod) {
          if (debug) load();
          return;
        }

        var consent = read();
        if (consent === "granted") load();
        else if (consent === "denied") clearGaCookies();

        function attach() {
          if (!consent) {
            window.addEventListener("scroll", maybeShow, { passive: true });
            /* If the visitor already scrolled during the intro, the card can
               appear the moment the intro finishes. */
            introObserver = new MutationObserver(maybeShow);
            introObserver.observe(document.documentElement, {
              attributes: true,
              attributeFilter: ["class"],
            });
            maybeShow();
          }
          var slot = document.querySelector(".footer-nav");
          if (slot && !slot.querySelector("[data-consent-preferences]")) {
            var a = document.createElement("a");
            a.href = "#";
            a.dataset.consentPreferences = "1";
            a.textContent = "Cookie preferences";
            a.addEventListener("click", window.__msConsentPreferences);
            slot.appendChild(a);
          }
        }
        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", attach);
        else attach();
      })();
