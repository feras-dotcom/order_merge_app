query CartDeliveryOptionsDiscountsGenerateRunInput($windowStart: DateTimeWithoutTimezone!, $windowEnd: DateTimeWithoutTimezone!) {
  cart {
    buyerIdentity { isAuthenticated customer { id numberOfOrders metafield(namespace: "$app", key: "ship_elig") { jsonValue } } }
    deliveryGroups {
      id
      deliveryAddress { countryCode provinceCode zip city }
      selectedDeliveryOption { handle title deliveryMethodType cost { amount currencyCode } }
      deliveryOptions { handle title deliveryMethodType cost { amount currencyCode } }
    }
  }
  discount { discountClasses metafield(namespace: "$app", key: "config") { jsonValue } }
  shop { localTime { date inWindow: dateTimeBetween(startDateTime: $windowStart, endDateTime: $windowEnd) } }
}
